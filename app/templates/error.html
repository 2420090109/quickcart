{% extends "base.html" %}
{% block title %}{{ code }} — QuickCart{% endblock %}
{% block content %}
<div class="text-center py-20">
    <div class="text-7xl">
        {% if code == 404 %}🔍{% elif code == 500 %}💥{% else %}⚠️{% endif %}
    </div>
    <h1 class="mt-6 text-3xl font-bold text-gray-900">{{ code }}</h1>
    <p class="mt-2 text-gray-600 max-w-md mx-auto">{{ message }}</p>
    <div class="mt-8 flex flex-wrap gap-3 justify-center">
        <a href="/" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg">Go home</a>
        <a href="/shops" class="px-5 py-2.5 bg-white border border-gray-300 hover:border-brand-500 text-gray-800 font-semibold rounded-lg">Browse shops</a>
    </div>
</div>
{% endblock %}
