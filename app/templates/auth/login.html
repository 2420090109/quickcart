{% extends "base.html" %}
{% block title %}Login — QuickCart{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="bg-white rounded-2xl border border-gray-200 p-8">
        <h1 class="text-2xl font-bold text-gray-900">Welcome back</h1>
        <p class="text-sm text-gray-600 mt-1">Log in to continue shopping.</p>
        <form hx-post="/login" hx-target="#login-error" hx-swap="innerHTML" class="mt-6 space-y-4" novalidate>
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone number</label>
                <input type="tel" name="phone" id="phone" required pattern="[0-9]{10,15}" inputmode="numeric" placeholder="9876543210"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" id="password" required minlength="1" placeholder="••••••••"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
            </div>
            <div id="login-error" class="text-sm text-red-600"></div>
            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg transition-colors">
                <span class="htmx-indicator mr-2">⏳</span>
                Log in
            </button>
        </form>
        <p class="text-sm text-gray-600 mt-6 text-center">
            New here?
            <a href="/signup" class="text-brand-600 font-medium hover:underline">Create an account</a>
        </p>
        <div class="mt-6 pt-4 border-t border-gray-200">
            <p class="text-xs text-gray-500 text-center">Demo accounts — password: DemoPass123</p>
            <div class="grid grid-cols-2 gap-2 mt-2 text-xs text-gray-600">
                <button type="button" onclick="fillDemo('9000000003')" class="hover:text-brand-600 text-left">Customer · 9000000003</button>
                <button type="button" onclick="fillDemo('9000000002')" class="hover:text-brand-600 text-left">Shop owner · 9000000002</button>
                <button type="button" onclick="fillDemo('9000000001')" class="hover:text-brand-600 text-left">Admin · 9000000001</button>
                <button type="button" onclick="fillDemo('9000000004')" class="hover:text-brand-600 text-left">Delivery · 9000000004</button>
            </div>
        </div>
    </div>
</div>
<script>
    function fillDemo(phone) {
        document.getElementById('phone').value = phone;
        document.getElementById('password').value = 'DemoPass123';
    }
</script>
{% endblock %}
