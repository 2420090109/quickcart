{% extends "base.html" %}
{% block title %}Sign up — QuickCart{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="bg-white rounded-2xl border border-gray-200 p-8">
        <h1 class="text-2xl font-bold text-gray-900">Create your account</h1>
        <p class="text-sm text-gray-600 mt-1">Order groceries in minutes.</p>
        <form hx-post="/signup" hx-target="#signup-error" hx-swap="innerHTML" class="mt-6 space-y-4" novalidate>
            <div>
                <label for="full_name" class="block text-sm font-medium text-gray-700 mb-1">Full name</label>
                <input type="text" name="full_name" id="full_name" required minlength="2" maxlength="120" placeholder="Priya Sharma"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
            </div>
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone number</label>
                <input type="tel" name="phone" id="phone" required pattern="[0-9]{10,15}" inputmode="numeric" placeholder="9876543210"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-gray-400 font-normal">(optional)</span></label>
                <input type="email" name="email" id="email" maxlength="255" placeholder="you@example.com"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" id="password" required minlength="8" placeholder="At least 8 characters"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500" />
            </div>
            <div id="signup-error" class="text-sm text-red-600"></div>
            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg transition-colors">
                <span class="htmx-indicator mr-2">⏳</span>
                Create account
            </button>
        </form>
        <p class="text-sm text-gray-600 mt-6 text-center">
            Already have an account?
            <a href="/login" class="text-brand-600 font-medium hover:underline">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
